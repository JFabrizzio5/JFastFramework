[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jfastframework"
dynamic = ["version"]
description = "Plugin-based FastAPI framework for microservices, designed to be driven by AI agents."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: the expression plus the file it comes from, so the wheel carries the
# licence text rather than a three-letter claim about it. `license = {text =
# "MIT"}` with no LICENSE in the tree is the default-deny case -- GitHub shows
# no licence, and anyone reading the repository has no grant.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Fabrizzio" }]
keywords = ["fastapi", "microservices", "plugins", "scaffolding", "ai-agents", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Kernel dependencies only. Everything else is an optional plugin extra.
#
# Ceilings on the four this framework is built on top of, and on nothing else.
# A floor alone is a promise about code that does not exist yet: `pip install`
# on somebody's machine six months from now resolves whatever shipped in
# between, and the first anyone hears of a breaking release is a service that
# stops importing -- on their deployment, not in this CI. These four sit in the
# request path and their types are re-exported from here, so a major of theirs
# is a major here. Raising a ceiling is a release with a test run behind it,
# which is the point of having one. `typer` and `tzdata` are tools rather than
# API surface and keep floors only.
dependencies = [
    "fastapi>=0.115,<1",
    # Imported directly by nine modules here -- middleware, the proxy headers,
    # the error responses -- and it was never declared, so the version this
    # framework runs on was whatever FastAPI happened to pull. FastAPI's own
    # requirement is `starlette>=0.46.0` with no ceiling, which is how a
    # starlette 2.0 would arrive unannounced in a service that pinned
    # everything it knew about.
    "starlette>=0.46,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # 0.27.1 against click 8.5.0 turned `typer.Exit(1)` into a zero exit
    # status, so every command that reports failure by exit code went green.
    # Nothing observable changed, which is why it went unnoticed; 0.27.2 fixes
    # it and is the floor.
    "typer>=0.27.2",
    "jinja2>=3.1",
    # `zoneinfo` is standard library but the database it reads is not: on Linux
    # it comes from the system under /usr/share/zoneinfo, and Windows ships
    # none at all. A framework whose `timezone` setting stops the boot on an
    # unknown name cannot leave the presence of the name to the image -- the
    # failure lands at start-up on the deployment that omitted the package,
    # which is the one nobody tested. ~500 KB of pure Python, and `zoneinfo`
    # prefers the system copy where there is one.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.32"]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14"]
cache = ["redis>=5.2"]
metrics = ["prometheus-client>=0.21"]
sentry = ["sentry-sdk>=2.19"]
mongo = ["motor>=3.6"]
qdrant = ["qdrant-client>=1.12"]
# The vector store is a separate choice: rag[+db] for pgvector, rag[+qdrant]
# for Qdrant. The plugin says which one is missing if you pick wrong.
rag = ["httpx>=0.28"]
# jinja2 is already a kernel dependency; python-multipart is what makes
# HTML form posts work.
web = ["python-multipart>=0.0.20"]
# jinja2 is already a kernel dependency; the mail plugin needs nothing
# else, because smtplib is in the standard library.
mail = []

# --- capabilities, added by `jfast add`, never installed by default -----
#
# A service that serves JSON should not carry numpy. Keeping these out of
# the base install is also what keeps the plugin graph describing the
# service: everything present is something the service asked for.

# img2pdf embeds a JPEG losslessly where Pillow would re-encode it.
exports = ["openpyxl>=3.1", "pypdf>=5.1", "img2pdf>=0.5", "pillow>=11.0"]
# Renders the same Jinja templates the mail plugin uses. Needs system
# libraries in the image: libpango, libharfbuzz, libffi.
render = ["weasyprint>=63"]
# lxml for iterparse over large documents; signxml verifies XML-DSig.
xml = ["lxml>=5.3", "signxml>=4.0"]
dataframes = ["polars>=1.17"]
# pandas only when a library you depend on speaks nothing else.
pandas = ["pandas>=2.2"]
# headless: the default wheel links GUI libraries a slim container lacks.
vision = ["opencv-python-headless>=4.10", "pillow>=11.0"]
# pydantic's EmailStr accepts anything until email-validator is installed.
validation = ["email-validator>=2.2", "phonenumbers>=8.13"]
locale = ["babel>=2.16"]
retry = ["tenacity>=9.0"]
gateway = ["httpx>=0.28"]
auth = ["pyjwt[crypto]>=2.10", "httpx>=0.28"]
queue = []
rabbitmq = ["aio-pika>=9.5"]
# Local disks need nothing: the standard library can write a file.
storage = []
# The storage pipeline's optimise-image step, and nothing else. Same Pillow
# the exports and vision extras already pull, so a service carrying either
# adds no wheel by asking for this one.
images = ["pillow>=11.0"]
s3 = ["boto3>=1.35"]
# Firebase Cloud Messaging. google-auth mints the OAuth token; the send
# itself is a plain HTTPS call, so no firebase-admin SDK is needed.
fcm = ["httpx>=0.28", "google-auth>=2.35"]
oidc = ["pyjwt[crypto]>=2.10", "httpx>=0.28"]
# Secret managers, split by cloud: google-cloud-secret-manager pulls grpc,
# which is a lot to install on a machine that only talks to AWS.
aws = ["boto3>=1.35"]
gcp = ["google-cloud-secret-manager>=2.21"]
kafka = ["aiokafka>=0.12"]
docs = ["markdown>=3.7", "pygments>=2.18"]
worker = ["arq>=0.26"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    # An async SQLAlchemy driver with no server, so the repository tests
    # exercise real SQL without a container.
    "aiosqlite>=0.20",
    "pip-audit>=2.7",
    "bandit[toml]>=1.8",
    # The suite tests the plugins, so it imports what the plugins import:
    # without this, `pip install -e ".[dev]"` collects seven ImportErrors and
    # the real incantation lives only in the CI workflow. `dev` is the name a
    # contributor guesses, so it has to be the one that works.
    "jfastframework[all]",
]
all = [
    "jfastframework[server,db,cache,metrics,sentry,mongo,qdrant,rag,web,gateway,auth,queue,rabbitmq,kafka,worker,storage,images,s3,fcm,oidc,aws,mail,exports,xml,validation,locale,retry]",
]

[project.scripts]
jfast = "jfastframework.cli.main:app"

# Built-in plugins are registered through the same entry-point group that
# third-party plugins use. No special-casing in the kernel.
[project.entry-points."jfastframework.plugins"]
observability = "jfastframework.plugins.builtin.observability:ObservabilityPlugin"
metrics = "jfastframework.plugins.builtin.metrics:MetricsPlugin"
sentry = "jfastframework.plugins.builtin.sentry:SentryPlugin"
database = "jfastframework.plugins.builtin.database:DatabasePlugin"
cache = "jfastframework.plugins.builtin.cache:CachePlugin"
mongo = "jfastframework.plugins.builtin.mongo:MongoPlugin"
qdrant = "jfastframework.plugins.builtin.qdrant:QdrantPlugin"
rag = "jfastframework.plugins.builtin.rag:RagPlugin"
web = "jfastframework.plugins.builtin.web:WebPlugin"
gateway = "jfastframework.plugins.builtin.gateway:GatewayPlugin"
auth = "jfastframework.plugins.builtin.auth:AuthPlugin"
queue = "jfastframework.plugins.builtin.queue:QueuePlugin"
events = "jfastframework.plugins.builtin.events:EventsPlugin"
storage = "jfastframework.plugins.builtin.storage:StoragePlugin"
tenancy = "jfastframework.plugins.builtin.tenancy:TenancyPlugin"
ratelimit = "jfastframework.plugins.builtin.ratelimit:RateLimitPlugin"
notifications = "jfastframework.plugins.builtin.notifications:NotificationsPlugin"
mail = "jfastframework.plugins.builtin.mail:MailPlugin"
channels = "jfastframework.plugins.builtin.channels:ChannelsPlugin"
websocket = "jfastframework.plugins.builtin.websocket:WebSocketPlugin"

[project.urls]
Homepage = "https://github.com/JFabrizzio5/JFastFramework"
Documentation = "https://github.com/JFabrizzio5/JFastFramework/tree/main/docs"

[tool.hatch.version]
# Single source of truth. Two hand-edited version strings drift.
path = "src/jfastframework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jfastframework", "src/pene", "src/vagina"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "ASYNC"]
# ASYNC109 wants a cancel scope instead of a `timeout` parameter. That is trio
# house style; `dequeue(timeout=...)` here maps onto a broker primitive
# (Redis BLMOVE takes a timeout) and hiding it would be the worse API.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# The CLI draws prompts and markers with typographic characters on purpose.
# RUF001 exists to catch a homoglyph slipped into an identifier, not a chevron
# in a prompt nobody parses.
"src/jfastframework/cli/ui.py" = ["RUF001"]
# glyphs.py is nothing but those characters: it is the table of them.
"src/jfastframework/cli/glyphs.py" = ["RUF001"]
"src/jfastframework/cli/main.py" = ["B008", "RUF001"]
# FastAPI dependencies are declared as call-in-default; that is the API.
"src/jfastframework/plugins/builtin/*" = ["B008"]
"tests/*" = ["B008"]

[tool.mypy]
# Deliberately not pinned to a python_version: mypy then checks against the
# interpreter it runs on, and CI runs it on every version in the support
# matrix. Pinning 3.11 while running on a newer interpreter makes mypy parse
# third-party stubs (numpy, via qdrant-client) under the wrong grammar and
# fail on syntax it should never have to read.
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional extras are deliberately opaque to mypy.
#
# They are not installed in every environment, and their typing changes between
# releases: redis annotates `from_url` in some versions and not others, so a
# strict run passes locally and fails in CI on nothing we wrote. numpy (pulled
# in transitively by qdrant-client) is worse -- its stubs fail to even parse
# under an older target grammar.
#
# `follow_imports = "skip"` makes every symbol from these packages `Any`, which
# is honest: we do not control their types and cannot rely on them being stable
# across the support matrix. Our own use of them stays covered by tests, and
# `disallow_untyped_calls` still applies everywhere else in the codebase.
module = [
    "sentry_sdk",
    "sentry_sdk.*",
    "prometheus_client",
    "prometheus_client.*",
    "redis",
    "redis.*",
    "qdrant_client",
    "qdrant_client.*",
    "motor",
    "motor.*",
    "numpy",
    "numpy.*",
    "aiokafka",
    "aiokafka.*",
    "aio_pika",
    "aio_pika.*",
    "markdown",
    "arq",
    "arq.*",
    "jwt",
    "jwt.*",
    "boto3",
    "boto3.*",
    "img2pdf",
    "openpyxl",
    "openpyxl.*",
    "pypdf",
    "pypdf.*",
    "lxml",
    "lxml.*",
    "polars",
    "cv2",
    # Pillow's package name; only the `images`, `exports` and `vision` extras
    # install it, so a bare `mypy src` cannot resolve it otherwise.
    "PIL",
    "PIL.*",
    "weasyprint",
    "botocore",
    "botocore.*",
    "google",
    "google.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.bandit]
# Only the shipped package. Test code asserts, builds throwaway secrets and
# binds to 0.0.0.0 on purpose; scanning it produces noise, not findings.
exclude_dirs = ["tests", "legacy", ".venv", "site"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
