name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The rate limiter's token bucket is a Lua script, and the websocket
    # fan-out crosses a pub/sub backplane. Neither can be proven against a
    # test double: a double cannot show that Redis runs the script to
    # completion with nothing interleaved, and it cannot show that a
    # message reaches the one worker holding the socket. Both suites skip
    # themselves without this, which is how a concurrency guarantee ends up
    # shipped and never observed.
    services:
      # The read/write split's whole correctness claim is that a read
      # following a write does not land on a lagging replica. That cannot
      # be shown against SQLite, and the suite skips without a server.
      # pgvector's image is postgres:16 plus the `vector` extension: the rag
      # suite (HNSW, hybrid search, RLS on the chunks table) skips without it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jfast
          POSTGRES_PASSWORD: jfast
          POSTGRES_DB: jfast
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U jfast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Without the health check the first test can race the container's
        # startup and fail on a connection refused that looks like a bug in
        # the code under test.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Delayed jobs and retry backoff on RabbitMQ are queue TTLs and
      # dead-letter exchanges, which exist only inside the broker. A user of
      # its own, because `guest` may only connect from the broker's loopback
      # and the runner reaches the container through the Docker bridge.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: jfast
          RABBITMQ_DEFAULT_PASS: jfast
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # setuptools is upgraded first. It is not a dependency of this
        # package -- hatchling does the building -- but setup-python ships one
        # in the runner's environment, pip-audit sees it, and the version it
        # ships has lagged behind published advisories. Upgrading is the honest
        # fix; waiving a real advisory because it is inconvenient is not.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"

      # `services:` starts a server, it does not run SQL. The suite treats
      # these four as a lagging primary/replica pair plus two tenants.
      - name: Databases the split and tenancy suites expect
        env:
          PGPASSWORD: jfast
        run: |
          for db in primarydb replicadb tenant_a tenant_b; do
            psql -h localhost -p 5499 -U jfast -d jfast -c "CREATE DATABASE $db"
          done

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Types, as Windows sees them
        # `dev.py` calls os.killpg and signal.SIGKILL behind a platform guard.
        # mypy narrows on `sys.platform` and checks against the host's stdlib
        # otherwise, so this ran clean on every runner here and failed on any
        # Windows machine -- five errors in code that never executes there. A
        # flag is cheaper than a Windows runner for this particular question.
        run: mypy --platform win32 src

      - name: Tests
        # The URL is what un-skips the two suites above. A test that skips
        # in CI and passes locally is a test nobody is running.
        #
        # `python -m pytest`, not `pytest`: `tests/` is not a package, and a
        # few suites name a stub by import path (`tests.test_scheduler:_Stub`).
        # Only `-m` puts the checkout on sys.path; plain `pytest` fails four
        # scheduler tests with "No module named tests" when that file runs
        # without the rest of the suite -- which the step below does.
        env:
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
          JFAST_TEST_RABBITMQ_URL: amqp://jfast:jfast@localhost:5672/
        run: python -m pytest -q

      # Named, because a skip is silent and these are the only evidence that
      # the atomicity, the fan-out, the pinning, the transaction races, the
      # broker-held delays, local events, the worker's shutdown, dead letters,
      # SQL spans and the tenancy switch are real.
      - name: Prove the tests needing a real server actually ran
        env:
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
          JFAST_TEST_RABBITMQ_URL: amqp://jfast:jfast@localhost:5672/
        # `shell: bash` adds pipefail: without it the `| tee` hides a failure.
        shell: bash
        run: |
          python -m pytest -q -rs --no-header \
            tests/test_ratelimit.py::test_lua_script_against_real_redis \
            tests/test_websocket.py::test_a_message_published_on_one_worker_reaches_a_socket_on_the_other \
            tests/test_database_postgres.py \
            tests/test_transactions.py \
            tests/test_outbox.py \
            tests/test_idempotency.py \
            tests/test_rls.py \
            tests/test_accounts.py \
            tests/test_accounts_flows.py \
            tests/test_rabbitmq_queue.py \
            tests/test_scheduler.py \
            tests/test_local_events.py \
            tests/test_worker_cli.py \
            tests/test_dead_letters.py \
            tests/test_telemetry.py \
            tests/test_tenancy_enable_pg.py \
            tests/test_startup_ddl.py \
            | tee /tmp/server-tests.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/server-tests.log; then
            echo '::error::a test needing a real server skipped; a service container is not reachable'
            exit 1
          fi

      # A framework shipping opinionated auth and storage defaults should audit
      # its own dependency tree. Both are hard gates.
      #
      # When a finding lands on an unrelated pull request, the order is: try
      # upgrading the package first, and only if it cannot be upgraded, waive
      # it here explicitly -- `pip-audit --ignore-vuln PYSEC-0000-000` with a
      # comment saying which code path makes it inapplicable. Same for bandit
      # with `# nosec BXXX` and the reason on the line above. What must not
      # happen is a step going yellow and being ignored, which is how a
      # security check stops meaning anything.
      - name: Audit dependencies
        # --skip-editable: this project is installed from the checkout, so the
        # copy being audited is not the one on PyPI and there is nothing to
        # look up for it.
        run: pip-audit --skip-editable --desc

      - name: Static security scan
        run: bandit -c pyproject.toml -r src -ll

      # The generator is the part most likely to break silently: templates
      # render fine but produce code that does not import, or a Jinja
      # environment eats the runtime braces a Vue file needs. Both smoke
      # scripts render real trees and run what they produce.
      - name: Scaffold smoke
        run: bash scripts/smoke.sh

      - name: Contracts smoke
        run: bash scripts/smoke_contracts.sh

      - name: Auth and Kubernetes smoke
        run: bash scripts/smoke_auth_k8s.sh

      - name: Storage, tenancy and serverless smoke
        run: bash scripts/smoke_storage_tenancy.sh

      - name: Workspace smoke
        run: bash scripts/smoke_workspace.sh

      - name: Quickstart smoke
        # The documented commands, run exactly as documented. Docs that have
        # never been executed are a guess.
        run: bash scripts/smoke_docs.sh

      - name: Docs site builds and validates
        run: |
          pip install -e ".[docs]"
          python docs-site/build.py --version ci --output site/ci
          python docs-site/check.py site/ci

      # Last, because it pauses the job's own PostgreSQL and Redis: anything
      # after it would run against containers that were frozen a moment ago.
      # `docker pause` keeps the socket open and stops answering, the hard
      # case a refused connection never shows. Each drill checks the status
      # inside its deadline, what /ready names, and recovery with no restart
      # (docs/resilience.md). The service keys below must match `services:`.
      # The identity-provider drill needs no container and also runs above.
      - name: Failure drills (pauses the services, so it runs last)
        env:
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
          JFAST_DRILL_PG_CONTAINER: ${{ job.services.postgres.id }}
          JFAST_DRILL_REDIS_CONTAINER: ${{ job.services.redis.id }}
        shell: bash
        run: |
          python -m pytest -q -s -rs --no-header tests/test_failure_drills.py \
            | tee /tmp/drills.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/drills.log; then
            echo '::error::a failure drill skipped; it was not told which container to pause'
            exit 1
          fi

  # The CLI is a developer tool, and a good share of the developers who would
  # try this framework are on Windows. Everything above runs on Linux only,
  # which is how three Windows-only defects shipped: no system zone database
  # so every non-UTC name failed, POSIX-only calls that failed `mypy` and a
  # console encoding that turned the help text into replacement characters.
  #
  # One job, one version, no service containers: the suites that need a real
  # PostgreSQL or Redis skip here and are proved on Linux. What this answers
  # is the narrower question nothing else did -- does it work at all there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"

      - name: Types
        run: mypy src

      - name: Tests
        run: python -m pytest -q

      # The CLI writes em dashes and box drawing; a Windows console that is
      # not UTF-8 renders them as `?`. The framework has a fallback for this
      # and nothing was running it on the platform it exists for.
      - name: The CLI renders on a non-UTF-8 console
        shell: cmd
        run: |
          chcp 437
          jfast --help
          jfast new service --help

  # Generated projects in other languages get their own job, because the
  # point of generating them is that they build. A scaffold nobody has run
  # is a liability that looks like a feature.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pip install -e ".[all,dev]"
      - name: Generate, vet, test, build and run a Go service
        run: bash scripts/smoke_go.sh
      # Tokens minted by the Python auth plugin, verified by the generated Go
      # service; the tenant and the trace context compared across the hop.
      # The main test job skips it: it has no Go toolchain.
      - name: Cross-language auth, tenancy and trace context
        run: python -m pytest -q tests/test_go_service.py

  # The image the generator writes, built and run against a real PostgreSQL.
  # Its own job because it needs Docker and a few minutes, and because four
  # shipped defects lived in exactly this gap: every other check installs the
  # framework from the checkout with all extras and never builds an image.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Build and run the generated image
        run: bash scripts/smoke_docker.sh

  # The job above builds the image and wires the network, the database and the
  # environment by hand -- which is the work the generated compose file is
  # supposed to do, so nothing ever ran that file. Three defects lived in the
  # gap and all three reached a release: a compose file with no Dockerfile to
  # build, an api container reading the host's DSN, and `jfast start` shipping
  # a module it never mounted.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Run the generated compose files the way the panel says to
        run: bash scripts/smoke_compose.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[all,dev]"
      - name: Generate, install and build the Vue and React frontends
        run: bash scripts/smoke_frontend.sh

  # `jfast check` tells a user to run ruff, ruff format, mypy and pytest, and
  # 0.1.0a10's generated projects failed three of the four on a tree nobody
  # had touched. This generates every shape -- `jfast start` single- and
  # multitenant, `jfast new service` with every plugin that needs no server of
  # its own; each layout in example, `--fields` and `--bare` form -- and gates
  # each project on its own tools, `mypy --strict` included.
  generated-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Generated projects pass ruff, format, mypy --strict and pytest
        run: JFAST=jfast PY=python bash scripts/smoke_generated_quality.sh

  # The claim `jfast upgrade --check` makes is that it names everything a
  # project has to change. This installs the previous release from PyPI,
  # generates a project with it, installs this checkout's wheel over it, and
  # requires exactly the change codes in scripts/smoke_upgrade.expected --
  # then applies each remedy and runs the project's own tests. A break the
  # manifest does not name fails the project's tests with nothing listed.
  upgrade-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Previous release from PyPI, upgraded to this checkout
        run: PY=python bash scripts/smoke_upgrade.sh

  # Windows' monotonic clock moves in ~15.6 ms steps. That is how the JWKS
  # single-flight bug hid until 0.1.0a10: two readings in one tick looked like
  # no time had passed. The `windows` job runs on the real thing but without
  # PostgreSQL or Redis, so the concurrency suites skip there. This runs them
  # against real servers on Linux with the clock floored to 1/64 s
  # (tests/windows_clock.py), five rounds, because a timing bug that shows up
  # half the time needs more than one draw.
  windows-clock:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jfast
          POSTGRES_PASSWORD: jfast
          POSTGRES_DB: jfast
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U jfast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Databases the split and tenancy suites expect
        env:
          PGPASSWORD: jfast
        run: |
          for db in primarydb replicadb tenant_a tenant_b; do
            psql -h localhost -p 5499 -U jfast -d jfast -c "CREATE DATABASE $db"
          done
      - name: Concurrency suites on a Windows-grained clock (5 rounds)
        env:
          JFAST_TEST_WINDOWS_CLOCK: "1"
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::round ${i}"
            python -m pytest -q tests/test_auth.py tests/test_cache.py tests/test_ratelimit.py \
              tests/test_queue.py tests/test_redis_queue.py tests/test_scheduler.py \
              tests/test_http_client.py tests/test_outbox.py tests/test_idempotency.py || exit 1
            echo "::endgroup::"
          done

  # Row-level security sets the tenant with a transaction-local set_config.
  # Behind PgBouncer in transaction mode one server connection serves many
  # clients in turn, so "transaction-local" is the whole claim: anything a
  # client leaves on the connection, the next one inherits. This runs
  # tests/test_rls_pgbouncer.py through a real PgBouncer with one server
  # connection (two tenants alternating on the same backend), and through a
  # second one with several connections and no prepared-statement tracking,
  # where asyncpg's defaults fail and `[plugin.database] pgbouncer = true`
  # fixes them. See docs/multitenancy.md, "Behind PgBouncer".
  #
  # The image is pinned: 1.25.2 is the PgBouncer the docs were verified
  # against, and `latest` moved to 1.26 on the day this job was written.
  pgbouncer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jfast
          POSTGRES_PASSWORD: jfast
          POSTGRES_DB: jfast
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U jfast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # PgBouncer connects to PostgreSQL when the first client logs in, which
      # is after the step below has created the role, so no ordering is
      # needed between the services.
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_NAME: jfast
          DB_USER: jfast_bouncer
          DB_PASSWORD: jfast_bouncer
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "1"
          MAX_PREPARED_STATEMENTS: "0"
        ports:
          - 6435:5432
      pgbouncer-multi:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_NAME: jfast
          DB_USER: jfast_bouncer
          DB_PASSWORD: jfast_bouncer
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "4"
          MAX_PREPARED_STATEMENTS: "0"
        ports:
          - 6436:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      # The test creates this role too, but only in the fixture of the tests
      # that use it; creating it here first means no test depends on the order
      # the others ran in. NOSUPERUSER NOBYPASSRLS: the only kind a policy binds.
      - name: The role PgBouncer logs in as
        env:
          PGPASSWORD: jfast
        run: >-
          psql -h localhost -p 5499 -U jfast -d jfast -c
          "CREATE ROLE jfast_bouncer LOGIN PASSWORD 'jfast_bouncer' NOSUPERUSER NOBYPASSRLS"
      - name: RLS behind PgBouncer in transaction mode
        env:
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
          JFAST_TEST_PGBOUNCER_URL: postgresql+asyncpg://jfast_bouncer:jfast_bouncer@localhost:6435/jfast
          JFAST_TEST_PGBOUNCER_MULTI_URL: postgresql+asyncpg://jfast_bouncer:jfast_bouncer@localhost:6436/jfast
        shell: bash
        run: |
          python -m pytest -q -rs --no-header tests/test_rls_pgbouncer.py | tee /tmp/pgbouncer.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/pgbouncer.log; then
            echo '::error::a PgBouncer test skipped; a PgBouncer service is not reachable'
            exit 1
          fi

  # tests/test_telemetry.py checks every span against the in-memory exporter,
  # which never serialises a span or sends it anywhere. This exports over
  # OTLP/HTTP to a real Jaeger and reads the trace back from its query API,
  # installing only the `telemetry` extra so a missing dependency of the
  # exporter shows up here and not in a user's deployment. The image is the
  # one `include_infra = true` generates.
  telemetry:
    runs-on: ubuntu-latest
    services:
      jaeger:
        image: jaegertracing/jaeger:2.10.0
        ports:
          - 4318:4318
          - 16686:16686
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[telemetry,dev]"
      # The image has no shell for a health command, so wait from outside:
      # spans sent before the OTLP receiver is up are dropped, not queued.
      - name: Wait for Jaeger
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:16686/ && exit 0
            sleep 2
          done
          echo '::error::Jaeger did not answer on 16686'
          exit 1
      # FastAPI 0.142 ships OpenTelemetry of its own that reads the same
      # endpoint variable; left on, it doubled every server span under a
      # second provider. The test that proves create_app turns it off skips on
      # a FastAPI without the switch, and a developer venv had 0.141 -- so
      # here the newest FastAPI the ceiling allows is installed explicitly and
      # a skip fails the step. (The main job's refuse-to-skip list runs the
      # same test on the matrix.)
      - name: FastAPI's own telemetry stays off, on the newest FastAPI
        shell: bash
        run: |
          pip install --upgrade "fastapi<1"
          python -c "import fastapi; print('fastapi', fastapi.__version__)"
          python -m pytest -q -rs --no-header \
            tests/test_telemetry.py::test_fastapis_own_telemetry_never_exports_beside_ours \
            | tee /tmp/native-otel.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/native-otel.log; then
            echo '::error::this FastAPI has no native telemetry; the regression test did not run'
            exit 1
          fi
      - name: Spans exported over OTLP and read back from Jaeger
        env:
          JAEGER_URL: http://localhost:16686
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
        run: bash scripts/smoke_telemetry.sh

  # What the framework costs per request, as a ratio to bare FastAPI measured
  # on the same runner in the same run -- never absolute microseconds, which
  # differ between runners. 0.1.0a10 took the auth + tenancy stack from 2,411
  # to 8,581 req/s; this keeps it from sliding back one innocent middleware at
  # a time. The checked-in baseline has no Linux entry, so the base of the
  # change is measured here first, with this checkout's script and the base's
  # framework, and the change is compared against that (20 % tolerance).
  # A pull request compares with its base branch; a push to main with the
  # commit before it.
  performance-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Measure the base, same runner, same script
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          git worktree add --detach "${RUNNER_TEMP}/base" "${BASE}"
          PYTHONPATH="${RUNNER_TEMP}/base/src" python scripts/bench_overhead.py --json \
            > "${RUNNER_TEMP}/base.json"
      - name: This change stays within 20 % of the base
        env:
          JFAST_PERF_BUDGET: "1"
          JFAST_PERF_BASELINE: ${{ runner.temp }}/base.json
        shell: bash
        run: |
          python -m pytest -q -rs --no-header tests/test_performance_budget.py | tee /tmp/budget.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/budget.log; then
            echo '::error::the performance budget skipped; it compared against nothing'
            exit 1
          fi

  # The S3 disk against a real object store: put, get, stat, listing past one
  # page, signed URLs fetched and then expired, a presigned upload, multipart
  # streams and their abort, health. It was `unverified` until this existed.
  #
  # The image: MinIO stopped publishing its own. Checked 2026-09-30, Docker
  # Hub refuses anonymous pulls of minio/minio and dl.min.io answers 410 Gone.
  # tests/test_storage_minio.py was verified locally against
  # minio/minio:RELEASE.2025-09-07T16-13-09Z; the community fork pinned below
  # has NOT been run against it yet -- the first CI run is that check. It
  # starts in a step because a service container cannot be given
  # `server /data`.
  storage-minio:
    runs-on: ubuntu-latest
    env:
      MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=jfastminio -e MINIO_ROOT_PASSWORD=jfastminio-secret \
            "${MINIO_IMAGE}" server /data
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:9010/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          echo '::error::MinIO did not become live on 9010'
          exit 1
      - name: The S3 disk against MinIO
        env:
          JFAST_TEST_S3_URL: http://localhost:9010
          JFAST_TEST_S3_ACCESS_KEY: jfastminio
          JFAST_TEST_S3_SECRET_KEY: jfastminio-secret
        shell: bash
        run: |
          python -m pytest -q -rs --no-header tests/test_storage_minio.py | tee /tmp/minio.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/minio.log; then
            echo '::error::a MinIO test skipped; the object store is not reachable'
            exit 1
          fi

  # Two API replicas and two workers against one PostgreSQL and one Redis:
  # the outbox relay, the scheduler, the LLM budget and token revocation each
  # happen exactly once. Also the rollups, the tenant-index finding in the
  # pgvector store (a strict xfail), `jfast bench` and the route order.
  multi-replica:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jfast
          POSTGRES_PASSWORD: jfast
          POSTGRES_DB: jfast
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U jfast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Replicas, rollups, RAG scale, bench and route order
        env:
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
        shell: bash
        run: |
          python -m pytest -q -rs --no-header tests/test_multi_replica.py tests/test_rollups.py \
            tests/test_rag_scale.py tests/test_cli_bench.py tests/test_route_order.py \
            | tee /tmp/replicas.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/replicas.log; then
            echo '::error::a test needing a real server skipped; a service container is not reachable'
            exit 1
          fi
